<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Background Crystal Shield Gradient -->
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Inner Dark Glass Gradient -->
    <linearGradient id="innerGlass" x1="8" y1="8" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a152e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#060b18" stop-opacity="0.98" />
    </linearGradient>

    <!-- Supersonic Booster Lightning / Arrow Gradient -->
    <linearGradient id="boosterGrad" x1="14" y1="36" x2="34" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="crystalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glowing Faceted Shield -->
  <polygon points="24,3 43,10 41,33 24,45 7,33 5,10" 
           fill="url(#shieldGrad)" 
           opacity="0.9" />

  <!-- Inner Dark Glass Base -->
  <polygon points="24,5.5 40.5,11.8 38.8,31.8 24,42.5 9.2,31.8 7.5,11.8" 
           fill="url(#innerGlass)" 
           stroke="url(#shieldGrad)" 
           stroke-width="1.2" 
           stroke-linejoin="round" />

  <!-- Crystal Facet Highlight (Top-Left Specular Reflection) -->
  <polygon points="24,5.5 40.5,11.8 24,24 9.2,14" 
           fill="#ffffff" 
           opacity="0.08" />

  <!-- Supersonic Booster Chevron & Soundwave Dynamic Emblem -->
  <!-- Left Wave Accent -->
  <path d="M13 22 C13 18, 15 15, 18 13" 
        stroke="#4ade80" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.75" />

  <!-- Right Wave Accent -->
  <path d="M35 22 C35 18, 33 15, 30 13" 
        stroke="#60a5fa" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.75" />

  <!-- Center Supersonic Rocket Booster Arrow (Ascending Speech Falcon) -->
  <path d="M24 10 
           L32 23 
           L27 23 
           L29 36 
           L21 27 
           L25 27 
           L18 20 
           L24 10 Z" 
        fill="url(#boosterGrad)" 
        stroke="#ffffff" 
        stroke-width="0.8" 
        stroke-linejoin="round"
        filter="url(#crystalGlow)" />

  <!-- Core Energy Spark -->
  <circle cx="24" cy="20" r="2.2" fill="#ffffff" />
  <circle cx="24" cy="20" r="4" fill="#4ade80" opacity="0.4" />
</svg>
